[package]
name = "cloudreve-cli"
version = "0.5.4"
edition = "2024"
description = "Command-line interface for Cloudreve API"
license = "MIT"
authors = ["larriti"]
repository = "https://github.com/larriti/cloudreve-cli"
keywords = ["cloudreve", "cli", "storage", "cloud"]
categories = ["command-line-utilities"]

[[bin]]
name = "cloudreve-cli"
path = "src/main.rs"

[dependencies]
cloudreve-api = "0.5"

clap = { version = "4.0", features = ["derive", "cargo"] }
clap_complete = "4.5"
dirs = "6.0.0"
env_logger = "0.11.8"
indicatif = "0.18.3"
rpassword = "7.0"
log = "0.4"
toml = "0.9.8"

reqwest = { version = "0.13", features = ["json", "multipart", "socks"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
url = "2.0"
chrono = { version = "0.4", features = ["serde"] }

glob = "0.3"
futures = "0.3"

base64 = "0.22"
tempfile = "3.14"
viuer = "0.11"
image = "0.25"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
assert_fs = "1.1"

tokio = { version = "1.0", features = ["full", "test-util"] }

toml = "0.9"
env_logger = "0.11"
tempfile = "3.14"
regex = "1.11"
serial_test = "3.2"
